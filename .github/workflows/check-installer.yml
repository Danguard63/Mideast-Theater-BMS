# Compiles the installer script against a tiny stand-in theater folder, to catch script errors.
# The real installer is built on a PC with the theater installed (installer\build-installer.bat).
name: Check installer script
on:
  push:
    paths: ["installer/**", "*.md", ".github/workflows/check-installer.yml"]
  workflow_dispatch:
jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stand-in theater
        shell: pwsh
        run: |
          $t = "$env:RUNNER_TEMP\Add-On Mideast128"
          foreach ($d in "Campaign","Terrdata\theaterdefinition","Terrdata\ObjectsNT\FE_Backup","Terrdata\Mideast\NewTerrain\Photoreal\backup tiles","NT\Art") { New-Item -ItemType Directory -Force "$t\$d" | Out-Null }
          foreach ($f in "Campaign\save0.cam","Campaign\SA-2 test1.tac","Campaign\SA10 TEST.tac","Campaign\TASMO VERIFICA.tac","Campaign\Auto Save.cam","Campaign\te_new_Nt.tac","Campaign\dharan.tac","Campaign\The Day of the Jackal new.tac","Terrdata\theaterdefinition\Mideast128_NT.tdf","Terrdata\ObjectsNT\FE_Backup\x.XML","Terrdata\ObjectsNT\Airbases_leveling.csv","Terrdata\ObjectsNT\Falcon4_CT.xml","Terrdata\Mideast\NewTerrain\Photoreal\backup tiles\530.dds","NT\Art\a.dds") { Set-Content "$t\$f" "x" }
          "SRC=$t" | Out-File -Append $env:GITHUB_ENV
      - name: Compile
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DSrcDir=$env:SRC" installer\Mideast.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Install into a stand-in BMS folder and check
        shell: pwsh
        timeout-minutes: 10
        run: |
          $bms = "$env:RUNNER_TEMP\Falcon BMS 4.38"
          New-Item -ItemType Directory -Force "$bms\Bin","$bms\Data\TerrData\TheaterDefinition","$bms\Data\Add-On Mideast128\Campaign" | Out-Null
          "TerrData\TheaterDefinition\Korea KTO.tdf" | Set-Content "$bms\Data\TerrData\TheaterDefinition\theater.lst"
          "old" | Set-Content "$bms\Data\Add-On Mideast128\Campaign\old437.cam"
          $exe = (Get-ChildItem installer\Output\*.exe | Select-Object -First 1).FullName
          $p = Start-Process $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=`"$bms`"","/LOG=`"$env:RUNNER_TEMP\setup.log`"" -PassThru
          if (-not $p.WaitForExit(240000)) { Get-Content "$env:RUNNER_TEMP\setup.log" -ErrorAction SilentlyContinue | Select-Object -Last 40; Get-Process | Where-Object { $_.Name -like "*Setup*" -or $_.Name -like "is-*" } | Format-Table Name,Id,MainWindowTitle; throw "setup did not finish" }
          Get-Content "$env:RUNNER_TEMP\setup.log" | Select-Object -Last 15
          $t = "$bms\Data\Add-On Mideast128"
          Get-ChildItem -Recurse $t | ForEach-Object { $_.FullName.Substring($t.Length) } | Tee-Object list.txt
          $l = Get-Content list.txt -Raw
          foreach ($bad in "SA-2 test1","SA10 TEST","TASMO VERIFICA","Auto Save","FE_Backup","Airbases_leveling","backup tiles","old437","dharan","Jackal") { if ($l -match [regex]::Escape($bad)) { throw "should not be installed: $bad" } }
          foreach ($good in "save0.cam","te_new_Nt.tac","Mideast128_NT.tdf","Falcon4_CT.xml","CHANGELOG.md","unins000.exe") { if ($l -notmatch [regex]::Escape($good)) { throw "missing after install: $good" } }
          if (Test-Path "$bms\Data\Add-On Mideast128 (old)") { throw "an (old) folder was made" }
          $lst = Get-Content "$bms\Data\TerrData\TheaterDefinition\theater.lst" -Raw; $lst
          if ($lst -notmatch [regex]::Escape("Add-On Mideast128\Terrdata\theaterdefinition\Mideast128_NT.tdf")) { throw "theater.lst not updated" }
          "install OK"
          $u = Start-Process "$t\Uninstall\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru
          if (-not $u.WaitForExit(120000)) { throw "uninstaller did not finish" }
          Start-Sleep 15
          $lst = Get-Content "$bms\Data\TerrData\TheaterDefinition\theater.lst" -Raw; $lst
          if ($lst -match "Mideast128_NT") { throw "theater.lst line not removed by the uninstaller" }
          if (Test-Path "$t\Campaign\save0.cam") { throw "files left after uninstall" }
          if (-not (Test-Path "$bms\Data\TerrData\TheaterDefinition\theater.lst")) { throw "theater.lst lost" }
          "uninstall OK"
